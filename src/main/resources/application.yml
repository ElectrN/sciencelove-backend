spring:
  application:
    name: sciencelove-backend

  security:
    user:
      name: admin
      password: admin
      roles: USER

  # Database
  datasource:
    url: jdbc:postgresql://localhost:5433/sciencelove_dev
    username: RaineWhispers
    password: F@byf_777
    driver-class-name: org.postgresql.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Flyway (миграции БД)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # File Upload
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# Server
server:
  port: 8080

# JWT
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production-min-32-chars}
  expiration: 86400000

# File Storage
app:
  storage:
    path: ./uploads

# Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    config-url: /v3/api-docs/swagger-config
    url: /v3/api-docs